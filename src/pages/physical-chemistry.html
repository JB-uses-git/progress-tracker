<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physical Chemistry Progress Tracker</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div class="container">
        <div class="tracker-container">
            <div class="columns-container">
                <!-- Columns will be dynamically generated here -->
            </div>
        </div>
    </div>

    <!-- Load utilities and components -->
    <script src="../js/utils/storage.js"></script>
    <script src="../js/components/chapterManager.js"></script>
    <script src="../js/components/progressTracker.js"></script>
    
    <script>
        // Initialize progress tracker for physical chemistry
        let tracker;
        
        document.addEventListener('DOMContentLoaded', () => {
            tracker = new ProgressTracker('physical-chemistry');
        });
    </script>
</body>
</html>
